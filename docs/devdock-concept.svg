  <text x="744" y="698" fill="#f1f4f8" font-family="Georgia,serif" font-size="20" font-weight="700">Последняя активность</text>
  <text x="744" y="719" fill="#6f7784" font-family="Inter,Arial,sans-serif" font-size="12">GitHub не подключён</text>
  <text x="1260" y="701" fill="#89929f" font-family="Inter,Arial,sans-serif" font-size="11">Активность →</text>
  <text x="744" y="757" fill="#5f6874" font-family="Inter,Arial,sans-serif" font-size="15">Нет доступных публичных событий.</text>

  <rect x="1056" y="846" width="184" height="3" rx="2" fill="url(#accent)" opacity="0.8"/>
