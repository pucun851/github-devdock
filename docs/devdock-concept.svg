  <text x="424" y="610" fill="#f1f4f8" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">—</text>
  <text x="424" y="628" fill="#6f7784" font-family="Inter,Arial,sans-serif" font-size="11">звёзд</text>
  <text x="747" y="564" fill="#bfc7d1" font-family="Inter,Arial,sans-serif" font-size="16">⌘</text>
  <text x="747" y="610" fill="#f1f4f8" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">—</text>
  <text x="747" y="628" fill="#6f7784" font-family="Inter,Arial,sans-serif" font-size="11">Forks</text>
  <text x="1070" y="564" fill="#bfc7d1" font-family="Inter,Arial,sans-serif" font-size="16">♙</text>
  <text x="1070" y="610" fill="#f1f4f8" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">—</text>
  <text x="1070" y="628" fill="#6f7784" font-family="Inter,Arial,sans-serif" font-size="11">подписчиков</text>

  <g filter="url(#shadow)">
    <rect x="78" y="666" width="614" height="188" rx="24" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="718" y="666" width="644" height="188" rx="24" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
