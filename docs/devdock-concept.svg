  <text x="214" y="375" fill="#f4f6f9" font-family="Georgia,serif" font-size="48" font-weight="700">Developer Dashboard</text>
  <text x="214" y="408" fill="#777f8c" font-family="Inter,Arial,sans-serif" font-size="16">Подключи GitHub, чтобы пользоваться реальными данными и действиями.</text>

  <text x="920" y="260" fill="#66707d" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">СТАТИСТИКА АККАУНТА</text>
