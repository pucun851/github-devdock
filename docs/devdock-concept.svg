  <text x="920" y="354" fill="#f1f4f8" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="700">—</text>
  <text x="920" y="382" fill="#6f7784" font-family="Inter,Arial,sans-serif" font-size="13">звёзд</text>
  <line x1="920" y1="422" x2="1334" y2="422" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="920" y="456" fill="#f1f4f8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">—</text>
  <text x="920" y="476" fill="#6f7784" font-family="Inter,Arial,sans-serif" font-size="11">Forks</text>
  <text x="1058" y="456" fill="#f1f4f8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">—</text>
  <text x="1058" y="476" fill="#6f7784" font-family="Inter,Arial,sans-serif" font-size="11">Репозитории</text>
  <text x="1210" y="456" fill="#f1f4f8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">—</text>
  <text x="1210" y="476" fill="#6f7784" font-family="Inter,Arial,sans-serif" font-size="11">События</text>

