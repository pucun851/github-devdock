  <text x="795" y="94" fill="#7f8794" font-family="Inter,Arial,sans-serif" font-size="14">Поиск</text>
  <text x="865" y="94" fill="#7f8794" font-family="Inter,Arial,sans-serif" font-size="14">Настройки</text>

  <rect x="1186" y="68" width="114" height="42" rx="21" fill="#0e1219" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="1243" y="94" text-anchor="middle" fill="#9aa3af" font-family="Inter,Arial,sans-serif" font-size="13">⌘K  Поиск</text>
  <circle cx="1330" cy="89" r="20" fill="#0e1219" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="1330" y="95" text-anchor="middle" fill="#9aa3af" font-family="Arial,sans-serif" font-size="14">☼</text>

  <rect x="78" y="150" width="1284" height="54" rx="16" fill="#10141b" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="104" cy="177" r="8" fill="#eef2f7"/>
  <text x="124" y="182" fill="#cfd6df" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">GitHub</text>
  <text x="124" y="199" fill="#6f7784" font-family="Inter,Arial,sans-serif" font-size="11">GitHub не подключён</text>
