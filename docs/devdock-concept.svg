<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">DevDock dashboard concept</title>
  <desc id="desc">Dark glassmorphism concept based on the DevDock dashboard screens: overview, statistics, activity stream and repositories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151923" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0e1118" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72e7ff"/>
      <stop offset="1" stop-color="#9e7cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1440" height="920" fill="url(#bg)"/>
  <rect width="1440" height="920" fill="url(#grid)"/>

  <rect x="34" y="30" width="1372" height="860" rx="30" fill="#07090d" stroke="#ffffff" stroke-opacity="0.08"/>

  <rect x="58" y="54" width="1324" height="70" rx="18" fill="#0b0e14" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="78" y="72" width="38" height="34" rx="10" fill="#161b24" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="97" y="94" text-anchor="middle" fill="#dfe6ee" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">&lt;/&gt;</text>
  <text x="130" y="95" fill="#f3f6fb" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">devdock</text>

  <rect x="468" y="68" width="74" height="42" rx="21" fill="#191d25"/>
  <text x="505" y="94" text-anchor="middle" fill="#f7f8fb" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Обзор</text>
  <text x="584" y="94" fill="#7f8794" font-family="Inter,Arial,sans-serif" font-size="14">Репозитории</text>
